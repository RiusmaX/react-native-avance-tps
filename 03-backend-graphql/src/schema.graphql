type User {
  id: ID!
  name: String!
  email: String!
  avatar: String
  createdAt: String!
}

type Post {
  id: ID!
  title: String!
  excerpt: String!
  body: String!
  createdAt: String!
  author: User!
  tags: [String!]!
}

type PostsResult {
  items: [Post!]!
  total: Int!
  hasMore: Boolean!
}

type UsersResult {
  items: [User!]!
  total: Int!
  hasMore: Boolean!
}

input CreatePostInput {
  title: String!
  body: String!
  authorId: String!
}

input UpdatePostInput {
  title: String
  body: String
}

type Query {
  posts(limit: Int, offset: Int, tag: String): PostsResult!
  post(id: ID!): Post
  users(limit: Int, offset: Int): UsersResult!
  user(id: ID!): User
  userPosts(userId: ID!, limit: Int, offset: Int): PostsResult!
}

type Mutation {
  createPost(input: CreatePostInput!): Post!
  updatePost(id: ID!, input: UpdatePostInput!): Post!
  deletePost(id: ID!): Boolean!
}
